[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faultrank"
version = "0.1.0"
description = "Offline spectrum-based fault localization engine with honest benchmarks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Khadija" }]
keywords = [
    "fault-localization",
    "spectrum-based",
    "debugging",
    "ochiai",
    "tarantula",
    "dstar",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5"]

[project.scripts]
faultrank = "faultrank.cli:main"

[project.urls]
Homepage = "https://github.com/KhadijaDurrany-svg/debug-localizer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faultrank = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
